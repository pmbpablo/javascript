<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>teste</title>
  </head>
  <body>
    <script>
      var corFavorita = "Amarelo";

      switch (corFavorita) {
        case "Azul":
          console.log("Olhe para o céu.");
          break;
        case "Vermelho":
          console.log("Olhe para rosas.");
          break;
        case "Amarelo":
          console.log("Olhe para o sol.");
          break;
        default:
          console.log("Feche os olhos");
      }
    </script>
  </body>
</html>
